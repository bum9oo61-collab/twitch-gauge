<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; }
        
        .wrapper { 
            width: 550px; 
            padding: 80px 40px 20px 40px; 
            background: rgba(0,0,0,0.5); 
            border-radius: 30px; 
            color: white; 
            position: relative;
        }

        .label { 
            font-size: 26px; 
            font-weight: bold; 
            margin-bottom: 15px; 
            display: flex; 
            justify-content: space-between;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .bar-container { 
            width: 100%; height: 25px; 
            background: #222; border-radius: 20px; 
            border: 3px solid #444; position: relative;
        }

        .bar-fill { 
            width: 0%; height: 100%; 
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%); 
            border-radius: 15px; 
            transition: width 1.5s ease-in-out; 
            position: relative; 
        }

        /* 캐릭터 박스 위치 조정 */
        .runner-box {
            position: absolute;
            right: -40px; 
            top: -95px;   /* 캐릭터를 바 위로 더 올림 */
            width: 100px;
            height: 100px;
        }

        .runner-img {
            width: 100%;
            height: auto;
            animation: bounce 0.6s infinite alternate;
            filter: drop-shadow(0px 0px 8px rgba(255,255,255,0.6));
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); }
        }

        #dist-text { color: #00f2fe; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="label">
            <span id="dist-text">현재: 0km</span>
            <span id="goal-text">목표: 0km</span>
        </div>
        <div class="bar-container">
            <div id="bar" class="bar-fill">
                <div class="runner-box">
                    <img id="runner-pic" class="runner-img" src="https://i.imgur.com/9WmfrpD.png" alt="runner">
                </div>
            </div>
        </div>
    </div>

    <script>
        const sheetId = '16JKGpNA4mWvOnM024HSOo5fLpOj0EftaKEg-2KqvOBk'; 
        // 데이터 범위를 명확히 지정하여 오류 방지
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&range=A2:B2`;

        async function updateGauge() {
            try {
                const response = await fetch(url + "&nocache=" + new Date().getTime());
                const csvData = await response.text();
                
                // 구글 API 결과물에서 따옴표 제거 및 데이터 추출
                const rows = csvData.split('\n');
                if (rows.length > 0) {
                    const cells = rows[0].replace(/"/g, '').split(',');
                    
                    const goal = parseFloat(cells[0]) || 5;    // A2 값
                    const current = parseFloat(cells[1]) || 0; // B2 값
                    const percent = Math.min((current / goal) * 100, 100);

                    // 화면 텍스트 및 바 위치 업데이트
                    document.getElementById('dist-text').innerText = `현재: ${current.toFixed(1)}km`;
                    document.getElementById('goal-text').innerText = `목표: ${goal.toFixed(1)}km`;
                    document.getElementById('bar').style.width = percent + '%';
                }
            } catch (e) { 
                console.error("데이터 업데이트 실패", e); 
            }
        }

        // 3초마다 갱신
        setInterval(updateGauge, 3000); 
        updateGauge();
    </script>
</body>
</html>
