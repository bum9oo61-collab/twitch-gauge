<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; }
        .wrapper { width: 500px; padding: 20px; background: rgba(0,0,0,0.7); border-radius: 20px; color: white; }
        .label { font-size: 24px; font-weight: bold; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .bar-container { width: 100%; height: 40px; background: #333; border-radius: 20px; overflow: hidden; border: 2px solid #555; }
        .bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ff00cc, #3333ff); transition: width 1s ease-in-out; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="label">
            <span id="dist-text">현재: 0km</span>
            <span id="goal-text">목표: 0km</span>
        </div>
        <div class="bar-container">
            <div id="bar" class="bar-fill"></div>
        </div>
    </div>

   <script>
        const sheetId = '16JKGpNA4mWvOnM024HSOo5fLpOj0EftaKEg-2KqvOBk'; 
        // 범위를 A2:B2로 고정해서 가져옵니다.
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&range=A2:B2`;

        async function updateGauge() {
            try {
                const response = await fetch(url + "&nocache=" + new Date().getTime()); // 캐시 방지
                const data = await response.text();
                
                // 데이터에서 숫자만 추출하는 정규식 활용
                // 따옴표나 공백을 제거하고 순수하게 숫자와 점(.)만 남깁니다.
                const rows = data.split('\n');
                const cells = rows[0].split(',').map(c => c.replace(/[^0-9.]/g, ''));
                
                const goal = parseFloat(cells[0]) || 5;    // 실패 시 기본값 5
                const current = parseFloat(cells[1]) || 0; // 실패 시 기본값 0
                
                const percent = Math.min((current / goal) * 100, 100);

                // 화면 업데이트
                document.getElementById('dist-text').innerText = `현재: ${current}km`;
                document.getElementById('goal-text').innerText = `목표: ${goal}km`;
                document.getElementById('bar').style.width = percent + '%';
                
                console.log("읽어온 값 - 목표:", goal, "현재:", current);
            } catch (e) { 
                console.error("데이터 로드 실패:", e); 
            }
        }

        setInterval(updateGauge, 3000); 
        updateGauge();
    </script>
</body>

</html>
