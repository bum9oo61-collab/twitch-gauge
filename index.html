<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; }
        
        .wrapper { 
            width: 520px; /* 잘림 방지를 위해 너비 살짝 가로로 확장 */
            padding: 120px 40px 30px 40px; 
            background: rgba(0,0,0,0.5); 
            border-radius: 30px; 
            color: white; 
            position: relative;
        }

        .label { 
            font-size: 24px; 
            font-weight: bold; 
            margin-bottom: 15px; 
            display: flex; 
            justify-content: space-between;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            /* 게이지 바와 위치를 맞추기 위해 왼쪽 여백 추가 */
            padding-left: 50px; 
        }

        .bar-container { 
            /* 뒷다리가 잘리지 않도록 바의 시작 위치를 오른쪽으로 50px 밀어줌 */
            width: calc(100% - 60px); 
            margin-left: 50px;
            height: 26px; 
            background: #222; border-radius: 20px; 
            border: 3px solid #444; position: relative;
        }

        .bar-fill { 
            width: 0%; height: 100%; 
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%); 
            border-radius: 15px; 
            transition: width 1.5s ease-in-out; 
            position: relative; 
        }

        /* 캐릭터 박스: 1.5배 크기 유지 */
        .runner-box {
            position: absolute;
            /* 바 끝 지점에서 캐릭터가 자연스럽게 겹치도록 설정 */
            right: -65px; 
            top: -145px;  
            width: 150px; 
            height: 150px;
            z-index: 10;
        }

        .runner-img {
            width: 100%;
            height: auto;
            animation: bounce 0.6s infinite alternate;
            filter: drop-shadow(0px 0px 10px rgba(255,255,255,0.7));
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); }
        }

        #dist-text { color: #00f2fe; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="label">
            <span id="dist-text">현재: 0km</span>
            <span id="goal-text">목표: 0km</span>
        </div>
        <div class="bar-container">
            <div id="bar" class="bar-fill">
