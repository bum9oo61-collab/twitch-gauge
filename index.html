<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; }
        
        /* 전체 컨테이너 */
        .wrapper { 
            width: 550px; 
            padding: 50px 40px 20px 40px; 
            background: rgba(0,0,0,0.4); 
            border-radius: 30px; 
            color: white; 
            position: relative;
        }

        /* 현재/목표 텍스트 라벨 */
        .label { 
            font-size: 24px; 
            font-weight: bold; 
            margin-bottom: 15px; 
            display: flex; 
            justify-content: space-between;
            text-shadow: 2px 2px 4px rgba(0,0,0,1);
        }

        /* 바닥 배경 바 */
        .bar-container { 
            width: 100%; 
            height: 25px; 
            background: #222; 
            border-radius: 20px; 
            border: 3px solid #444;
            position: relative;
        }

        /* 게이지가 차오르는 바 */
        .bar-fill { 
            width: 0%; 
            height: 100%; 
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%); 
            border-radius: 15px; 
            transition: width 1.5s ease-in-out; 
            position: relative;
        }

        /* 캐릭터 이미지 박스 - 크기 및 위치 조정 */
        .runner-box {
            position: absolute;
            right: -42px; /* 캐릭터 크기 절반만큼 오른쪽으로 이동 */
            top: -95px;   /* 캐릭터가 바 위에 떠 있도록 높이 조절 */
            width: 95px;  /* 기존보다 살짝 커진 크기 */
            height: 95px;
            text-align: center;
        }

        .runner-img {
            width: 100%;
            height: auto;
            /* 위아래로 들썩이는 애니메이션 */
            animation: bounce 0.6s infinite alternate;
            filter: drop-shadow(0px 0px 8px rgba(255,255,255,0.8));
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        #dist-text { color: #4facfe; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="label">
            <span id="dist-text">현재: 0km</span>
            <span id="goal-text">목표: 0km</span>
        </div>
        <div class="bar-container">
            <div id="bar" class="bar-fill">
                <div class="runner-box">
                    <img id="runner-pic" class="runner-img" src="https://i.imgur.com/9WmfrpD.png" alt="runner">
                </div>
            </div>
        </div>
    </div>

    <script>
        const sheetId = '16JKGpNA4mWvOnM024HSOo5fLpOj0EftaKEg-2KqvOBk'; 
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&range=A2:B2`;

        async function updateGauge() {
            try {
                const response = await fetch(url + "&nocache=" + new Date().getTime());
                const data = await response.text();
                
                const rows = data.split('\n');
                const cells = rows[0].split(',').map(c => c.replace(/[^0-9.]/g, ''));
                
                const goal = parseFloat(cells[0]) || 5;
                const current = parseFloat(cells[1]) || 0;
                const percent = Math.min((current / goal) * 100, 100);

                document.getElementById('dist-text').innerText = `현재: ${current}km`;
                document.getElementById('goal-text').innerText = `목표: ${goal}km`;
                document.getElementById('bar').style.width = percent + '%';
            } catch (e) { 
                console.error("데이터 업데이트 실패", e); 
            }
        }

        setInterval(updateGauge, 3000); 
        updateGauge();
    </script>
</body>
</html>
